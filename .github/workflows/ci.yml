name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate:local
      - name: Built Worker HTTP smoke
        shell: bash
        run: |
          pnpm preview > /tmp/starter-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health > /dev/null; then
              pnpm smoke
              exit 0
            fi
            sleep 1
          done
          echo 'Preview failed to become ready; inspect the local preview command.'
          exit 1
      # 実Secretを持たないローカルpreviewのログだけを出す。smokeの失敗原因を後から追うため。
      - name: Preview log on failure
        if: failure()
        shell: bash
        run: tail -n 200 /tmp/starter-preview.log || true
      - run: pnpm audit
