strictPeerDependencies: true
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.96'
  - ai@7.0.118
# Better Auth's optional Drizzle CLI resolves a legacy esbuild helper.
# Keep its transform API on a patched version; see docs/operations.md.
overrides:
  '@esbuild-kit/core-utils>esbuild': '0.28.1'
  # GHSA-3wwx-pv8p-q78v; keep the remaining consumer on the patched 7.x release.
  # miniflare@5.20261012 pins undici 7.29.1 and sharp 0.35.5 itself (2026-10-18).
  '@ai-sdk/provider-utils@5.0.49>undici': '7.29.1'
  # GHSA-68fv-2mgg-jv7q; scope the patched source-map implementation to its consumers.
  '@tailwindcss/node@4.3.3>source-map-js': '1.2.2'
